format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    code-copy: true
    highlight-style: github
    html-math-method: mathjax
    grid:
      sidebar-width: 340px
