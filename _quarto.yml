project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "chapters/*.qmd"
    - "notebooks/**/*.ipynb"

execute:
  enabled: false        # notebooks are pre-executed by build.sh
  freeze: auto

website:
  title: "Quantum Chaos & Scrambling"
  description: "A hands-on numerical tutorial on randomness, scrambling, and learning in quantum systems."
  site-url: "https://marcinplodzien.github.io/quantum-chaos-and-scrambling/"
  repo-url: "https://github.com/MarcinPlodzien/quantum-chaos-and-scrambling"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    background: primary
    search: true
    pinned: true
    left:
      - text: "Start here"
        href: index.qmd
      - text: "Tutorial"
        menu:
          - text: "1 · Mathematical Foundations"
            href: chapters/01-foundations.qmd
          - text: "2 · Random Matrix Theory"
            href: chapters/02-random-matrix-theory.qmd
          - text: "3 · Haar Measure & Weingarten Calculus"
            href: chapters/03-haar-weingarten.qmd
          - text: "4 · Quantum Dynamics & Chaos"
            href: chapters/04-dynamics.qmd
          - text: "5 · Designs & Clifford Ensembles"
            href: chapters/05-designs.qmd
          - text: "6 · Applications of Scrambling"
            href: chapters/06-applications.qmd
          - text: "7 · Quantum Machine Learning"
            href: chapters/07-qml.qmd
      - text: "Exercises (PDF)"
        href: exercises.qmd
    right:
      - icon: github
        href: "https://github.com/MarcinPlodzien/quantum-chaos-and-scrambling"
        aria-label: GitHub
  sidebar:
    style: floating
    search: true
    collapse-level: 1
    contents:
      - text: "Start here"
        href: index.qmd
      - section: "1 · Mathematical Foundations"
        href: chapters/01-foundations.qmd
        contents:
          - notebooks/ch1/solution_ch1_fubini_study.ipynb
          - notebooks/ch1/solution_ch1_entanglement_parametric.ipynb
          - notebooks/ch1/solution_ch1_depolarizing_channel.ipynb
          - notebooks/ch1/solution_ch1_dla_closure.ipynb
          - notebooks/ch1/solution_ch1_schur_weyl.ipynb
          - notebooks/ch1/solution_ch1_choi_amplitude_damping.ipynb
          - notebooks/ch1/solution_ch1_dim_lie_algebra.ipynb
          - notebooks/ch1/solution_ch1_exp_surjectivity.ipynb
          - notebooks/ch1/solution_ch1_haar_measure_unitary_group_rank_one.ipynb
          - notebooks/ch1/solution_ch1_quantum_speed_limit.ipynb
          - notebooks/ch1/solution_ch1_sectional_curvature.ipynb
          - notebooks/ch1/solution_ch1_differential_geometry_hilbert_space.ipynb
          - notebooks/ch1/solution_ch1_measure_theory_basics.ipynb
