name: Publish website

# OPTIONAL automatic rebuild. You do NOT need this to get the site online the
# first time (the pre-built ./docs folder is already included). This workflow
# re-executes all notebooks and re-renders the site whenever you push changes.
#
# To use it: Settings -> Pages -> Source: "GitHub Actions".
# (If instead you serve from the /docs folder, you can delete this file.)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source_notebooks/**"
      - "*.qmd"
      - "chapters/**"
      - "_quarto.yml"
      - "exercises_and_solutions_complete.pdf"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy matplotlib jupyter nbformat nbconvert ipykernel
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Build site
        run: EXEC_TIMEOUT=600 bash build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
