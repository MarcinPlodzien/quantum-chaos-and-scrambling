name: Publish website

# Publishes the PRE-BUILT ./docs folder to GitHub Pages.
#
# IMPORTANT: this workflow does NOT rebuild the site. The site (including all
# executed notebooks and their figures) is built locally by build.sh /
# update_site.sh, which have the full environment (NumPy + JAX). A previous
# version of this workflow re-ran build.sh in CI *without JAX installed*, so the
# JAX notebooks failed to execute and the site deployed with missing figures.
# We therefore just upload the committed ./docs and deploy it verbatim.
#
# Requires: Settings -> Pages -> Source = "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload pre-built ./docs (figures already rendered locally)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
